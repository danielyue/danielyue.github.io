<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Daniel Yue's Website</title>
<meta name="description" content="Daniel Yue is an assistant professor in Information Technology Management at Georgia Tech's Scheller College of Business, studying open disclosure, open source AI, and the economics of corporate scientific research."/>

<!-- ======================================================================
     HOW TO UPDATE THIS SITE
     ----------------------------------------------------------------------
     Almost everything you'd want to change lives in the DATA object
     a few screens below (search for "const DATA"). Edit strings there,
     commit, and GitHub Pages will redeploy. Layout & styling live below
     it and almost never need to be touched.
     ======================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    /* palette — cleaner/whiter */
    --paper:       #fdfcf8;
    --paper-2:     #f6f2e6;
    --rule:        #e6dfcc;
    --ink:         #1a1611;
    --ink-2:       #3a342a;
    --mute:        #7a7062;
    --accent:      #b04a2f;   /* terracotta — used sparingly */
    --accent-soft: #c8b9a0;
    --highlight:   #f5e6a8;   /* marginalia highlighter */

    --serif: "Newsreader", "Source Serif Pro", Georgia, serif;
    --mono:  "JetBrains Mono", ui-monospace, Menlo, monospace;

    --measure: 72ch;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{ background: var(--paper); }
  body{
    font-family: var(--serif);
    font-optical-sizing: auto;
    color: var(--ink);
    background: var(--paper);
    font-size: 19px;
    line-height: 1.55;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* paper texture — extremely subtle grain via layered gradients */
  body::before{
    content:"";
    position: fixed; inset:0;
    pointer-events:none;
    background:
      radial-gradient(1200px 800px at 85% -10%, rgba(176, 74, 47, 0.04), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, rgba(30, 24, 16, 0.05), transparent 60%);
    z-index: 0;
  }

  a{ color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--accent-soft); transition: border-color .15s, color .15s;}
  a:hover{ color: var(--accent); border-bottom-color: var(--accent); }

  /* ===== top rule: a little letterpress masthead ================= */
  .masthead{
    border-bottom: 1px solid var(--rule);
    padding: 22px 40px 18px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:24px;
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-2);
    position: relative;
    z-index: 2;
  }
  .masthead .left{ display:flex; gap:20px; align-items:baseline;}
  .masthead .dot{ color: var(--accent); }
  .masthead nav{ display:flex; gap:22px;}
  .masthead nav a{ border-bottom: none; color: var(--ink-2);}
  .masthead nav a:hover{ color: var(--accent);}
  .masthead .issue{ color: var(--mute);}

  /* ===== hero viz band ============================================ */
  .hero-viz{
    position: relative;
    width: 100%;
    height: clamp(110px, 14vw, 170px);
    overflow: hidden;
    border-bottom: 1px solid var(--rule);
    background: var(--paper);
    cursor: crosshair;
  }
  .hero-viz canvas{
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }
  @media (max-width: 760px){
    .hero-viz{ height: clamp(90px, 18vw, 130px);}
  }

  /* ===== main layout =============================================== */
  .page{
    max-width: 1280px;
    margin: 0 auto;
    padding: 40px 40px 80px;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 64px;
    position: relative;
    z-index: 1;
  }

  /* ----- sidebar (identity card) — lives in the right column ----- */
  aside.who{
    position: sticky;
    top: 40px;
    align-self: start;
    grid-column: 2;
    grid-row: 1;
  }
  main{ grid-column: 1; grid-row: 1; }
  .portrait-frame{
    width: 240px;
    aspect-ratio: 1/1;
    border: 1px solid var(--rule);
    padding: 10px;
    background: #fbf8ef;
    position: relative;
  }
  .portrait-frame::after{
    /* tiny corner tick-marks like a printer's register */
    content:"";
    position:absolute; inset:4px;
    background:
      linear-gradient(var(--mute),var(--mute)) left top/10px 1px no-repeat,
      linear-gradient(var(--mute),var(--mute)) left top/1px 10px no-repeat,
      linear-gradient(var(--mute),var(--mute)) right top/10px 1px no-repeat,
      linear-gradient(var(--mute),var(--mute)) right top/1px 10px no-repeat,
      linear-gradient(var(--mute),var(--mute)) left bottom/10px 1px no-repeat,
      linear-gradient(var(--mute),var(--mute)) left bottom/1px 10px no-repeat,
      linear-gradient(var(--mute),var(--mute)) right bottom/10px 1px no-repeat,
      linear-gradient(var(--mute),var(--mute)) right bottom/1px 10px no-repeat;
    pointer-events:none;
    opacity:.5;
  }
  .portrait-frame img{ width:100%; height:100%; display:block; object-fit:cover;}

  .name{
    font-family: var(--serif);
    font-weight: 500;
    font-size: 38px;
    line-height: 1.02;
    letter-spacing: -0.01em;
    margin: 28px 0 6px;
  }
  .name em{ font-style: italic; font-weight: 400;}
  .title-line{
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--mute);
    line-height: 1.6;
    margin-top: 4px;
  }
  .affil{
    margin-top: 18px;
    font-size: 15.5px;
    line-height: 1.5;
    color: var(--ink-2);
    max-width: 30ch;
  }
  .affil a{ border-bottom: 1px solid var(--rule);}

  .contact{
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid var(--rule);
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 6px 14px;
    font-size: 14px;
  }
  .contact dt{
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--mute);
    padding-top: 3px;
  }
  .contact dd{ margin: 0; font-size: 14.5px;}
  .contact dd a{ border-bottom: none;}
  .contact dd a:hover{ border-bottom: 1px solid var(--accent);}

  /* ----- main column ----- */
  main{ min-width: 0; }

  .lede{
    font-family: var(--serif);
    font-size: 32px;
    line-height: 1.2;
    font-weight: 400;
    letter-spacing: -0.012em;
    max-width: 44ch;
    color: var(--ink);
    margin: 0 0 28px;
    text-wrap: balance;
  }
  .lede em{ font-style: italic; color: var(--accent);}
  .lede .lede-rule{
    display: block;
    width: 56px;
    height: 2px;
    background: var(--accent);
    margin: 6px 0 22px;
  }

  .bio{
    font-size: 18px;
    line-height: 1.65;
    max-width: var(--measure);
    color: var(--ink-2);
    margin: 0 0 14px;
  }
  .bio strong{ color: var(--ink); font-weight: 500;}

  /* ===== section headings ========================================== */
  h2.section{
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--ink);
    margin: 56px 0 18px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--ink);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  h2.section .count{
    color: var(--mute);
    font-weight: 400;
    letter-spacing: 0.12em;
  }

  /* ===== research papers as "field notes" ========================= */
  .paper{
    display: grid;
    grid-template-columns: 80px 1fr;
    gap: 24px;
    padding: 22px 0 24px;
    border-bottom: 1px solid var(--rule);
    position: relative;
  }
  .paper:last-child{ border-bottom: none; }

  .paper .marg{
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.45;
    color: var(--mute);
    letter-spacing: 0.04em;
    padding-top: 6px;
  }
  .paper .marg .num{
    color: var(--accent);
    font-weight: 500;
    font-size: 13px;
    display: block;
    margin-bottom: 6px;
    letter-spacing: 0.08em;
  }
  .paper .marg .wp{
    display: block;
    margin-top: 8px;
    color: var(--mute);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .paper .marg .review{
    display: block;
    margin-top: 2px;
    color: var(--mute);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .paper .marg .venue{
    display: inline-block;
    margin-top: 4px;
    padding: 3px 7px;
    background: var(--accent);
    color: var(--paper);
    font-size: 9.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 500;
  }

  .paper h3{
    font-family: var(--serif);
    font-weight: 500;
    font-size: 23px;
    line-height: 1.2;
    letter-spacing: -0.005em;
    margin: 0 0 4px;
    max-width: 48ch;
    text-wrap: balance;
  }
  .paper h3 a{ border-bottom: none;}
  .paper h3 a:hover{ color: var(--accent);}

  .paper .authors{
    font-family: var(--serif);
    font-style: italic;
    font-size: 16px;
    color: var(--ink-2);
    margin: 0 0 8px;
  }
  .paper .authors .me{ font-style: normal; font-weight: 500; color: var(--ink); border-bottom: 1px solid var(--accent);}

  .paper .tldr{
    font-family: var(--serif);
    font-size: 18px;
    line-height: 1.5;
    color: var(--ink);
    max-width: 58ch;
    margin: 0 0 10px;
  }

  /* consolidated single-line actions row for papers */
  .paper .actions{
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 14px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 6px;
  }
  .paper .actions .act{
    color: var(--ink);
    background: none;
    border: none;
    border-bottom: 1px solid var(--rule);
    padding: 0 0 2px;
    font: inherit;
    letter-spacing: 0.06em;
    cursor: pointer;
  }
  .paper .actions .act:hover{ border-bottom-color: var(--accent); color: var(--accent);}
  .paper .actions .act .arrow{ color: var(--accent); margin-right: 4px;}
  .paper .actions .act-abstract[aria-expanded="true"] .arrow::before{ content: "−"; }
  .paper .actions .act-abstract[aria-expanded="true"] .arrow{ font-size: 0;}
  .paper .actions .act-abstract[aria-expanded="true"] .arrow::before{ font-size: 11px; color: var(--accent); margin-right: 4px; }
  .paper .actions .act-label{
    color: var(--mute);
    font-size: 10.5px;
    margin-left: 4px;
  }
  .paper .actions .act-press{
    color: var(--ink-2);
  }

  .paper .abstract{
    margin-top: 12px;
    padding: 14px 18px;
    background: var(--paper-2);
    border-left: 2px solid var(--accent);
    font-size: 15.5px;
    line-height: 1.6;
    color: var(--ink-2);
    max-width: 68ch;
  }
  .paper .abstract p{ margin: 0 0 10px; }
  .paper .abstract p:last-child{ margin-bottom: 0; }

  /* ===== teaching ================================================== */
  .course{
    padding: 28px 0;
    border-bottom: 1px solid var(--rule);
    display: grid;
    grid-template-columns: 88px 1fr;
    gap: 28px;
  }
  .course:last-child{ border-bottom: none;}
  .course .marg{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--mute);
    letter-spacing: 0.04em;
    padding-top: 6px;
  }
  .course .marg .code{
    display:block;
    color: var(--accent);
    font-weight: 500;
    font-size: 12px;
    margin-bottom: 4px;
    letter-spacing: 0.08em;
  }
  .course .marg .level{
    display:block;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 10px;
    color: var(--mute);
  }
  .course h3{
    font-family: var(--serif);
    font-weight: 500;
    font-size: 24px;
    line-height: 1.25;
    margin: 0 0 12px;
    max-width: 34ch;
  }
  .course .desc{
    font-size: 17px;
    line-height: 1.6;
    color: var(--ink-2);
    max-width: 58ch;
    margin: 0 0 10px;
  }
  .course .topics{
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 12px 0;
  }
  .course .topics span{
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-2);
    padding: 3px 9px;
    background: var(--paper-2);
    border: 1px solid var(--rule);
  }
  .course .semesters{
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--mute);
    margin-top: 10px;
  }
  .course .semesters em{ color: var(--ink-2); font-style: normal;}
  .course .links{
    display: flex;
    gap: 18px;
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 6px;
  }
  .course .links a{ border-bottom: 1px solid var(--rule); padding-bottom: 2px;}
  .course .links a:hover{ border-bottom-color: var(--accent);}
  .course .links .arrow{ color: var(--accent);}

  /* footer: last updated line, minimal */
  .footer-line{
    margin-top: 56px;
    padding-top: 14px;
    border-top: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--mute);
  }

  /* ===== mobile =================================================== */
  @media (max-width: 900px){
    .masthead{ padding: 16px 20px; flex-wrap: wrap; gap: 12px;}
    .masthead nav{ gap: 14px;}
    .page{
      grid-template-columns: 1fr;
      gap: 40px;
      padding: 32px 20px 80px;
    }
    /* Both aside and main have grid-row:1 at desktop so they sit side-by-side.
       On mobile the grid is one column, so reset to auto and let the natural
       DOM order (aside → main) stack them vertically with the sidebar on top. */
    aside.who, main{ grid-row: auto; grid-column: 1; }
    aside.who{ position: static; }
    .portrait-frame{ width: 180px;}
    .name{ font-size: 34px; }
    .lede{ font-size: 24px; }
    .paper, .course, .colophon{ grid-template-columns: 1fr; gap: 14px;}
    .paper .marg, .course .marg, .colophon .marg{ padding-top: 0;}
    .paper h3, .course h3{ font-size: 22px;}
  }

  /* print */
  @media print{
    body{ background: white; color: black;}
    .masthead nav, .paper details{ display: none;}
  }

  /* ===== easter: subtle in-view reveal for papers ================= */
  .paper, .course{ opacity: 0; transform: translateY(6px); transition: opacity .5s ease, transform .5s ease;}
  .paper.in, .course.in{ opacity: 1; transform: none;}

</style>
</head>

// lede text — module-scoped so applyTweaks() can call it safely
function renderLede(idx){
  const el = document.getElementById("lede-text");
  if (!el) return;
  const lines = (typeof DATA !== "undefined" && DATA.heroLines) ? DATA.heroLines : [];
  const safeIdx = Math.max(0, Math.min(lines.length - 1, idx|0));
  el.innerHTML = lines[safeIdx] || "";
}

// JSON loader: if a `content.json` file sits next to index.html, its
// contents override the inline DATA above. Keys in content.json are
// shallow-merged on top of DATA, so you can override just a few fields
// (e.g. papers) without repeating everything. See README for the schema.
(async function bootstrap(){
  try{
    const res = await fetch("content.json", { cache: "no-cache" });
    if (res.ok){
      const ext = await res.json();
      Object.assign(DATA, ext);
    }
  }catch(e){ /* fine — fall back to inline DATA */ }
  render();
})();

/* =====================================================================
   HERO VIZ — three animated modes on a single canvas.
   - constellation: a drifting network of nodes with faint connections
   - tidal:         streams of particles flowing across a horizontal line
   - grid:          a field of tiny ticks that respond to the mouse and
                    emit occasional pulses
   Mouse interaction everywhere; pauses when tab is hidden or reduced-motion.
===================================================================== */
(function initHeroViz(){
  const wrap = document.getElementById("hero-viz");
  const canvas = document.getElementById("hero-canvas");
  const label = document.getElementById("hv-label");
  if (!wrap || !canvas) return;
  const ctx = canvas.getContext("2d");

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dpr = () => Math.min(window.devicePixelRatio || 1, 2);

  let W = 0, H = 0, mouse = { x: -999, y: -999, inside: false, clickedAt: 0 };
  let rafId = 0, t0 = performance.now(), lastT = t0;
  let mode = "constellation";
  let state = null;

  // --- accent resolution -------------------------------------------------
  function accentRGB(alpha = 1){
    const hex = (getComputedStyle(document.documentElement)
      .getPropertyValue("--accent") || "#b04a2f").trim();
    const m = hex.match(/^#([0-9a-f]{6})$/i);
    if (!m) return `rgba(176,74,47,${alpha})`;
    const n = parseInt(m[1], 16);
    return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${alpha})`;
  }
  function inkRGB(alpha = 1){
    return `rgba(26,22,17,${alpha})`;
  }

  // --- resize ------------------------------------------------------------
  const ro = new ResizeObserver(() => resize());
  ro.observe(wrap);
  function resize(){
    const r = wrap.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width  = Math.round(W * dpr());
    canvas.height = Math.round(H * dpr());
    canvas.style.width  = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr(), 0, 0, dpr(), 0, 0);
    if (state && state.onResize) state.onResize();
  }

  // --- mouse -------------------------------------------------------------
  wrap.addEventListener("mousemove", (e) => {
    const r = wrap.getBoundingClientRect();
    mouse.x = e.clientX - r.left;
    mouse.y = e.clientY - r.top;
    mouse.inside = true;
  });
  wrap.addEventListener("mouseleave", () => { mouse.inside = false; mouse.x = mouse.y = -999; });
  wrap.addEventListener("click", () => { mouse.clickedAt = performance.now(); if (state?.onClick) state.onClick(); });

  // =====================================================================
  // MODE A — CONSTELLATION: drifting nodes + connecting lines
  // =====================================================================
  function makeConstellation(){
    const N = Math.round(Math.min(70, Math.max(36, (W * H) / 6500)));
    const nodes = Array.from({length: N}, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - .5) * 0.16,
      vy: (Math.random() - .5) * 0.16,
      r: 1.4 + Math.random() * 2.4,
      phase: Math.random() * Math.PI * 2,
    }));
    const linkDist = Math.min(180, Math.max(120, Math.sqrt(W*H) / 7));
    const linkDist2 = linkDist * linkDist;

    return {
      label: "Constellation · knowledge as a drifting graph",
      onResize(){
        // keep nodes in bounds
        nodes.forEach(n => { n.x = Math.min(W - 2, Math.max(2, n.x)); n.y = Math.min(H - 2, Math.max(2, n.y)); });
      },
      step(dt){
        const mx = mouse.x, my = mouse.y, inside = mouse.inside;
        for (const n of nodes){
          n.x += n.vx * dt * 0.06;
          n.y += n.vy * dt * 0.06;
          // bounce
          if (n.x < 0) { n.x = 0; n.vx *= -1; }
          if (n.x > W) { n.x = W; n.vx *= -1; }
          if (n.y < 0) { n.y = 0; n.vy *= -1; }
          if (n.y > H) { n.y = H; n.vy *= -1; }
          // mouse repel
          if (inside){
            const dx = n.x - mx, dy = n.y - my;
            const d2 = dx*dx + dy*dy;
            if (d2 < 14400){
              const d = Math.sqrt(d2) || 1;
              const f = (1 - d/120) * 0.35;
              n.vx += (dx/d) * f * dt * 0.01;
              n.vy += (dy/d) * f * dt * 0.01;
            }
          }
          // mild damping
          n.vx *= 0.995; n.vy *= 0.995;
          n.phase += dt * 0.002;
        }
      },
      draw(){
        // connections
        for (let i = 0; i < nodes.length; i++){
          const a = nodes[i];
          for (let j = i+1; j < nodes.length; j++){
            const b = nodes[j];
            const dx = a.x - b.x, dy = a.y - b.y;
            const d2 = dx*dx + dy*dy;
            if (d2 < linkDist2){
              const alpha = (1 - d2/linkDist2) * 0.28;
              ctx.strokeStyle = inkRGB(alpha);
              ctx.lineWidth = 0.7;
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.stroke();
            }
          }
        }
        // nodes
        for (const n of nodes){
          const pulse = 0.7 + 0.3 * Math.sin(n.phase);
          // accent halo occasionally
          const accent = (n.r > 2.5);
          ctx.fillStyle = accent ? accentRGB(0.85 * pulse) : inkRGB(0.75 * pulse);
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
          ctx.fill();
          if (accent){
            ctx.strokeStyle = accentRGB(0.18);
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.r * 3.2, 0, Math.PI * 2);
            ctx.stroke();
          }
        }
      },
    };
  }

  // =====================================================================
  // MODE B — TIDAL: particles flowing across a horizontal threshold
  // =====================================================================
  function makeTidal(){
    const M = Math.round(Math.min(220, Math.max(90, W / 6)));
    const particles = [];
    function spawn(p){
      p.x = -10 - Math.random() * 40;
      p.y = H * (0.25 + Math.random() * 0.5);
      p.vx = 0.4 + Math.random() * 0.8;
      p.amp = 6 + Math.random() * 16;
      p.freq = 0.008 + Math.random() * 0.012;
      p.phase = Math.random() * Math.PI * 2;
      p.size = 0.7 + Math.random() * 1.8;
      p.life = 0;
      p.color = Math.random() < 0.18 ? "accent" : "ink";
    }
    for (let i=0;i<M;i++){ const p = {}; spawn(p); p.x = Math.random()*W; particles.push(p); }

    return {
      label: "Tidal · the quiet flow of open knowledge",
      onResize(){
        for (const p of particles){
          if (p.y > H) p.y = H * 0.5;
        }
      },
      step(dt){
        const mx = mouse.x, my = mouse.y, inside = mouse.inside;
        for (const p of particles){
          p.life += dt;
          p.phase += p.freq * dt;
          p.x += p.vx * dt * 0.08;
          // vertical wave
          const yBase = p.y + Math.sin(p.phase) * 0.3;
          p._yDraw = yBase + Math.sin(p.phase * 2) * p.amp * 0.3;
          // mouse nudge
          if (inside){
            const dx = p.x - mx, dy = p._yDraw - my;
            const d2 = dx*dx + dy*dy;
            if (d2 < 6400){
              const d = Math.sqrt(d2) || 1;
              p.vx += (dx/d) * 0.02 * dt * 0.01;
              p.y  += (dy/d) * 0.4;
            }
          }
          if (p.x > W + 20) spawn(p);
        }
      },
      draw(){
        // two faint threshold lines, one from each side
        ctx.strokeStyle = inkRGB(0.08);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, H * 0.5);
        ctx.lineTo(W, H * 0.5);
        ctx.stroke();

        // particles as tiny streaks
        for (const p of particles){
          const y = p._yDraw ?? p.y;
          const alpha = Math.min(1, p.life / 300) * 0.75;
          ctx.strokeStyle = p.color === "accent" ? accentRGB(alpha) : inkRGB(alpha * 0.85);
          ctx.lineWidth = p.size;
          ctx.beginPath();
          ctx.moveTo(p.x - p.vx * 8, y);
          ctx.lineTo(p.x, y);
          ctx.stroke();
        }

        // labels on the sides
        ctx.fillStyle = inkRGB(0.35);
        ctx.font = `500 10px "JetBrains Mono", monospace`;
        ctx.textBaseline = "middle";
        ctx.textAlign = "left";
        ctx.fillText("ꜰɪʀᴍ", 16, H * 0.5);
        ctx.textAlign = "right";
        ctx.fillText("ᴘᴜʙʟɪᴄ", W - 16, H * 0.5);
      },
    };
  }

  // =====================================================================
  // MODE C — GRID: field of ticks responsive to mouse, with periodic pulses
  // =====================================================================
  function makeGrid(){
    const SP = 22;
    let cols = 0, rows = 0, cells = [];
    function build(){
      cols = Math.max(4, Math.floor(W / SP));
      rows = Math.max(4, Math.floor(H / SP));
      cells = [];
      const ox = (W - (cols-1)*SP) / 2;
      const oy = (H - (rows-1)*SP) / 2;
      for (let r=0;r<rows;r++) for (let c=0;c<cols;c++){
        cells.push({ x: ox + c*SP, y: oy + r*SP, a: 0 });
      }
    }
    build();
    const pulses = [];
    let pulseTimer = 0;

    return {
      label: "Grid · a field of signals, waiting to propagate",
      onResize(){ build(); },
      onClick(){
        pulses.push({ x: mouse.x, y: mouse.y, r: 0, life: 0, strong: true });
      },
      step(dt){
        pulseTimer -= dt;
        if (pulseTimer <= 0){
          pulseTimer = 2800 + Math.random() * 2600;
          pulses.push({
            x: Math.random() * W,
            y: Math.random() * H,
            r: 0, life: 0, strong: false
          });
        }
        for (const p of pulses){ p.life += dt; p.r += dt * 0.28; }
        // drop expired
        for (let i = pulses.length - 1; i >= 0; i--){
          if (pulses[i].life > 2600) pulses.splice(i, 1);
        }
        // cells: base activation from mouse + pulses
        for (const c of cells){
          let a = 0;
          if (mouse.inside){
            const dx = c.x - mouse.x, dy = c.y - mouse.y;
            const d2 = dx*dx + dy*dy;
            if (d2 < 9000) a = Math.max(a, (1 - d2/9000) * 0.9);
          }
          for (const p of pulses){
            const dx = c.x - p.x, dy = c.y - p.y;
            const d = Math.sqrt(dx*dx + dy*dy);
            const band = Math.abs(d - p.r);
            if (band < 18){
              const boost = (1 - band/18) * (p.strong ? 1 : 0.7) * Math.max(0, 1 - p.life/2200);
              a = Math.max(a, boost);
            }
          }
          // ease toward target
          c.a += (a - c.a) * Math.min(1, dt * 0.012);
        }
      },
      draw(){
        for (const c of cells){
          const a = c.a;
          const size = 2 + a * 3.5;
          const alpha = 0.14 + a * 0.75;
          ctx.fillStyle = a > 0.55 ? accentRGB(alpha) : inkRGB(alpha);
          // tick: short vertical line, gets longer when active
          const h = 2 + a * 5;
          ctx.fillRect(c.x - 0.5, c.y - h/2, 1, h);
          if (a > 0.3){
            ctx.beginPath();
            ctx.arc(c.x, c.y, a * 1.6, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      },
    };
  }

  // --- mode dispatch -----------------------------------------------------
  function build(mode){
    switch(mode){
      case "tidal":  return makeTidal();
      case "grid":   return makeGrid();
      default:       return makeConstellation();
    }
  }

  function setVizImpl(name){
    if (name === mode && state) return;
    mode = name;
    state = build(name);
    if (label) label.textContent = state.label;
    resize();
  }
  // expose globally so applyTweaks can call it
  window.setViz = setVizImpl;

  // --- animation loop ----------------------------------------------------
  function loop(t){
    const dt = Math.min(64, t - lastT);
    lastT = t;
    if (!reduce) state.step(dt);
    ctx.clearRect(0, 0, W, H);
    state.draw();
    rafId = requestAnimationFrame(loop);
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden){ cancelAnimationFrame(rafId); rafId = 0; }
    else if (!rafId){ lastT = performance.now(); rafId = requestAnimationFrame(loop); }
  });

  // init
  resize();
  setVizImpl(tweaks?.viz || "constellation");
  rafId = requestAnimationFrame(loop);
})();
</script>

</body>
</html>
