- code: "MGMT 7609"
  title: "Observational Studies in Information Systems"
  level: "PhD"
  semesters: ["Fall 2025"]
  semesterNote: "5 students · Course 5.0/5.0 · Instructor 5.0/5.0"
  desc: >-
    A half-course on the often-invisible infrastructure of empirical
    research: data collection, conceptualization, and validation. We cover
    modern tools — web scraping, databases, data warehouses, LLMs, cloud
    clusters — in service of the question: what can we now feasibly answer?
  topics: ["Data Collection", "Validation", "LLM-Assisted Research"]
  links:
    - { label: "Syllabus", href: "https://equal-rondeletia-eec.notion.site/MGT-7609-Observational-Studies-in-Information-Systems-2460f068eb46804586c1f53e8e33908e" }
