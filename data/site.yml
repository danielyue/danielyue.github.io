# Candidate hero lines. The front-end picks one via heroLineIdx in index.html.
heroLines:
  - "Why do firms <em>openly share</em> innovative knowledge without directly profiting from it?"
  - "Why do firms give away the things they could most profitably sell—<em>code, papers, models, data</em>—and what happens when they do?"
  - "An economist of <em>open disclosure</em>: when companies share what they could keep."
  - "Studying the quiet economics of <em>openness</em>—in AI, in science, and in the firms that power both."
  - "When is <em>giving knowledge away</em> a firm's best strategy—and what does that mean for the rest of us?"

bio:
  - "I study the economics of <em>open disclosure</em> — when and why firms share innovative knowledge without directly profiting from it. I primarily study the AI industry through empirical research on scientific publications and open source software."
  - 'My work has been recognized with awards from the <strong>Academy of Management TIM division</strong> for my <a href="https://research.gatech.edu/daniel-yue-wins-best-dissertation-award-academy-management">dissertation</a> and for <a href="https://tim.aom.org/news/newsletter-june-2025">work studying PyTorch''s governance</a>, covered in the <a href="https://www.ft.com/content/353adf48-a5d6-4ea0-b5d7-9a94b141213a">Financial Times</a>, <a href="https://www.scmp.com/tech/tech-trends/article/3350340/chinas-ai-firms-scaled-open-source-models-next-phase-may-be-different">South China Morning Post</a>, and <a href="https://fortune.com/2026/07/14/data-centers-urban-rural-jobs-study/">Fortune</a>, and cited as evidence in <a href="https://www.brookings.edu/articles/from-open-internet-to-open-intelligence-why-ais-market-structure-matters-more-than-ever/">an address to the European Parliament</a> on the state of open models.'
  - 'I am a <a href="https://www.microsoft.com/en-us/research/articles/announcing-the-ai-economy-institutes-third-cohort-of-senior-fellows/"><strong>Senior Fellow of the Microsoft AI Economy Institute</strong></a> and an invited researcher with the <a href="https://www.povertyactionlab.org/initiative/science-progress-initiative-sfpi">Science for Progress Initiative</a> at J-PAL.'
  - "At Georgia Tech, I teach courses on the application of generative AI to business and to business research, spanning the undergraduate, MBA, and PhD levels."
  - "Before Georgia Tech, I completed my PhD at <strong>Harvard Business School</strong>, my undergrad in <strong>Physics at Harvard College</strong>, and worked as a product manager of analytics software at <strong>Mastercard</strong>."

